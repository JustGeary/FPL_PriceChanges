name: FPL Price Check
on:
  schedule:
    - cron: '45 2 * * *' # Independent fallback; primary is Cyberdyne at 00:05 UK.
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        default: deliver
        options: [deliver, check]
concurrency:
  group: fpl-price-delivery
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  price-changes:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests requests-oauthlib
      - name: Configure delivery commits
        run: |
          git config user.name 'fpl-price-bot'
          git config user.email 'bot@users.noreply.github.com'
      - name: Observe prices and deliver pending notifications
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_KEY_SECRET: ${{ secrets.X_API_KEY_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          RUN_MODE: ${{ inputs.mode }}
        run: |
          if [ "$RUN_MODE" = check ]; then
            python .github/scripts/reliable_run.py --check
          else
            python .github/scripts/reliable_run.py
          fi
      - name: Preserve report and delivery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fpl-delivery-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            changes.md
            data/delivery/*.json
